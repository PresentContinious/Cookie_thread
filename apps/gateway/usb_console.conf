# USB-CDC ACM console for the Cookie gateway / border router (read the whole
# mesh directly over the board's own USB-C as a COM port, no J-Link / RTT).
#
# The gateway already emits forwarded sensor frames, topology events and a
# heartbeat via printk (apps/gateway/src). This overlay just moves the console
# from the hardware UART to a USB-CDC serial port and brings USB up at boot.
# Pairs with usb_console.overlay.

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Cookie Gateway"

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

CONFIG_HWINFO=y

# No MCUboot in this project (sysbuild.conf): link at flash base 0x0 so the
# reset vector is valid when flashed straight over SWD.
CONFIG_USE_DT_CODE_PARTITION=n
