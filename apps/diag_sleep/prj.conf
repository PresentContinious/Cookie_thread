# Bare deep-sleep floor diagnostic. No OpenThread, no sensors, no radio: the
# kernel idle thread drops the nRF52840 into System ON deep sleep. Measures the
# board + MCU sleep floor with ideal firmware, to compare against the SED
# 0.51 mA and decide whether that floor comes from the Thread stack or the
# board hardware.

CONFIG_USE_DT_CODE_PARTITION=n

# Silent, lowest-overhead.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_LOG=n

# Power management: let the idle thread enter System ON deep sleep.
CONFIG_PM=y
CONFIG_PM_DEVICE=y
