# DFU image layout: the Nordic Open Bootloader keeps a static MBR in the first
# 4 kB of flash and its own USB bootloader at the top, so the application is
# linked at 0x1000 and handed to the board over USB with nrfutil instead of SWD.
#
# Layered on top of overlays/usb_console.conf: a board flashed over its own
# USB-C is also read over its own USB-C, so the console belongs on CDC-ACM.
# Pairs with overlays/dfu.overlay, which moves the settings storage partition
# clear of the bootloader region at the top of flash.

# No MCUboot in this project (see sysbuild.conf), so the code partition in
# devicetree does not describe this image. Take the load offset from Kconfig.
CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_FLASH_LOAD_OFFSET=0x1000

# The bootloader treats 0xDD000-0xDFFFF as application data: it never erases
# those pages during DFU and rejects any image that reaches past 0xDD000.
# Cap the link region so an oversized image fails at build time, not on DFU.
CONFIG_FLASH_LOAD_SIZE=0xDC000
