# Packet-size sweep support: room for a padded frame (up to 512 pad bytes on
# top of the full sensor set). Pair with profile_*.conf + measure.conf +
# meas_led.conf, then set the actual pad per build on the cmake line:
#   -DCONFIG_NODE_PAYLOAD_PAD_BYTES=<0|64|256|512>
CONFIG_COOKIE_PROTO_FRAME_BUF_SIZE=960
CONFIG_COOKIE_PROTO_COAP_BLOCK_SIZE=1024
