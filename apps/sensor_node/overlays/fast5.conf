# Faster reporting cadence for quicker bench measurements (5 s instead of 30 s).
# The per-wake current profile (sleep floor, active peak, t_active) is identical
# to the 30 s build; only the wake frequency changes. The real duty cycle used
# for battery-life numbers is reported separately, so measure at 5 s for speed
# then compute the average at the configured interval.
CONFIG_NODE_REPORT_INTERVAL_SEC=5
