# USB-CDC ACM console for the Cookie node (read the board directly over its
# own USB-C as a COM port, no J-Link / RTT).
#
# Layered on top of overlays/profile_auto.conf. The node already prints its
# telemetry frame as a JSON line via printk (node_loop.c); this overlay just
# moves the console from the hardware UART to a USB-CDC serial port and brings
# the USB device up at boot. Pairs with usb_console.overlay.

# USB device stack (next) + CDC ACM class, registered and enabled at boot by
# subsys/usb/device_next/app/cdc_acm_serial.c (no app code needed).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Cookie Node"

# Console routed to the CDC ACM UART declared in the overlay.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# Per-unit USB serial number from the chip, so Device Manager shows a stable
# port identity.
CONFIG_HWINFO=y

# Deferred logging so the log subsystem never stalls USB enumeration at boot
# (the failure mode behind the earlier OT + USB-CDC bring-up issue).
CONFIG_LOG_MODE_DEFERRED=y

# No MCUboot in this project (see sysbuild.conf). Link the image at flash base
# 0x0 so the reset vector is valid when flashed straight over SWD.
CONFIG_USE_DT_CODE_PARTITION=n
