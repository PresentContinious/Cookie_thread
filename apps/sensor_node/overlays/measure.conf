# Energy-measurement overlay. Pair with profile_sed.conf or profile_auto.conf
# via a semicolon EXTRA_CONF_FILE list.
#
# Two goals:
#  1. Bare-SWD flashing without a bootloader needs the image linked at flash
#     base 0x0 (the board defconfig pins USE_DT_CODE_PARTITION=y for MCUboot
#     at 0x0; with no bootloader the chip HardFaults on a blank vector table).
#  2. A clean active window: no console or logging, so the measured
#     sense -> transmit -> sleep duration reflects real work, not log traffic.
#     The node is observed through the frames it sends to the gateway, not
#     through its own console, so silencing it costs no visibility.

CONFIG_USE_DT_CODE_PARTITION=n

CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
