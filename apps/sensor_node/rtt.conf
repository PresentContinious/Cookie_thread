# Single-board bring-up: route console + logging to SEGGER RTT so telemetry
# is read over the same J-Link/SWD probe, with no UART-to-USB bridge wired.
# Pair with overlays/profile_auto.conf via a semicolon EXTRA_CONF_FILE list.
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# Bare-metal SWD flashing without a bootloader: the board defconfig pins
# USE_DT_CODE_PARTITION=y (image linked at slot0 = 0xC000, expecting MCUboot
# at 0x0). With no bootloader present the chip reads a blank vector table at
# 0x0 and HardFaults. Link the image at flash base 0x0 instead.
CONFIG_USE_DT_CODE_PARTITION=n

# Bring-up diagnostics: full DEBUG from the sensor wrappers so the ICM-20648
# probe result and any per-read I2C failure are visible over RTT.
CONFIG_COOKIE_SENSORS_LOG_LEVEL=4
