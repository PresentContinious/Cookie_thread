# Bare-metal SWD flashing without a bootloader, with NO RTT/console overhead.
# Use for energy measurement builds: the board defconfig pins
# USE_DT_CODE_PARTITION=y (image linked at slot0 = 0xC000, expecting MCUboot
# at 0x0). With no bootloader present the chip reads a blank vector table at
# 0x0 and HardFaults. Link the image at flash base 0x0 instead. Unlike
# rtt.conf this keeps console/logging off so SWD/RTT traffic does not hold
# the core awake or inflate the measured sleep current.
CONFIG_USE_DT_CODE_PARTITION=n
